<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 묵직한 다크 포레스트 그린 배경 (모서리를 살짝 둥글게 깎음) -->
  <rect width="100" height="100" rx="22" fill="#14281C" />
  
  <!-- 중앙에 배치된 얇고 우아한 명조체 'B' -->
  <text x="48%" y="54%" font-family="Georgia, 'Times New Roman', serif" font-size="65" font-weight="normal" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">B</text>
  
  <!-- 우측 상단에 찍힌 테라코타 오렌지색 엣지 포인트 -->
  <circle cx="78" cy="22" r="6" fill="#C08A64" />
</svg>
